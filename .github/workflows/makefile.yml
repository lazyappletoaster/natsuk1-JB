name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: configure
      run: ./configure

    - name: Install dependencies
      run: cd XMLFuzz && make ipa
           cd F1OOB-PoC && make ipa
           cd FastPoC && make ipa

    - name: Run check
      run: make check

    - name: Run distcheck
      run: make distcheck
